<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연세대학교 의료원 후원계좌 안내</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#f5f7fa;font-family:Arial,"Malgun Gothic",sans-serif;color:#222}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:520px;width:100%;background:#fff;border-radius:18px;padding:32px 24px;box-shadow:0 8px 30px #0001}
.brand{text-align:center;color:#2b5f9e;font-weight:bold}
h1{text-align:center;font-size:26px;margin:10px 0}
.sub{text-align:center;color:#777}
.info{border:1px solid #ddd;border-radius:12px;overflow:hidden;margin:24px 0}
.row{display:flex;padding:16px;border-bottom:1px solid #eee}.row:last-child{border:0}
.label{width:80px;color:#777}.value{flex:1;font-weight:bold}
button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:9px;font-size:16px;font-weight:bold;cursor:pointer}
.kakao{background:#fee500}.copy{background:#eef2f6}
.status{text-align:center;margin-top:10px;color:#666;font-size:13px}
.footer{text-align:center;color:#999;font-size:12px;line-height:1.6;margin-top:20px}
</style>
</head>
<body><div class="wrap"><main class="card">
<div class="brand">연세대학교 의료원</div>
<h1>후원계좌 안내</h1>
<p class="sub">소중한 후원에 감사드립니다.</p>
<div class="info">
<div class="row"><div class="label">은행</div><div class="value">우리은행</div></div>
<div class="row"><div class="label">계좌번호</div><div class="value">001-120802-61-000</div></div>
<div class="row"><div class="label">예금주</div><div class="value">연세대학교 의료원</div></div>
</div>
<button class="kakao" id="share">카카오톡으로 계좌정보 보내기</button>
<button class="copy" id="copy">계좌번호 복사</button>
<div class="status" id="status"></div>
<div class="footer">일반 웹호스팅에 업로드하여 사용할 수 있습니다.<br>카카오톡 공유 기능은 카카오디벨로퍼스 설정 후 작동합니다.</div>
</main></div>
<script>
const KAKAO_JAVASCRIPT_KEY="5175e7a3dfcc05c0a265a6cbda9a3543";
const PAGE_URL=location.href;
Kakao.init(KAKAO_JAVASCRIPT_KEY);
share.onclick=()=>{Kakao.Share.sendDefault({objectType:"text",text:"연세대학교 의료원 후원계좌 안내\n우리은행 001-120802-61-000\n예금주: 연세대학교 의료원",link:{mobileWebUrl:PAGE_URL,webUrl:PAGE_URL}})};
copy.onclick=async()=>{try{await navigator.clipboard.writeText("001-120802-61-000");status.textContent="계좌번호가 복사되었습니다."}catch(e){status.textContent="계좌번호: 001-120802-61-000"}};
</script></body></html>
